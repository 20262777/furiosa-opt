[package]
name = "rngd-kernels"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false
description = "Low-level vISA kernel library for FuriosaAI RNGD (TCP), developed rung by rung against torch ground truth."

# Marks this a kernel package: `cargo furiosa-opt` will compile the `#[device]`
# functions under `src/`. Required — see furiosa-opt `docs/src/introduction.md`.
[package.metadata.furiosa-opt]

# `cargo furiosa-opt` sets `--cfg backend="..."`. Declare the known values so a bare
# `cargo build` / `cargo check` does not emit unexpected-cfg warnings.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = [
    'cfg(backend, values("emulation", "npu", "typecheck"))',
    'cfg(furiosa_opt)',
] }

[lib]
path = "src/lib.rs"

[dependencies]
furiosa-opt-std = "0.5"

[dev-dependencies]
# Ground truth is generated by torch and loaded back through
# `HostTensor::from_safetensors`, the idiom `furiosa-opt-examples` uses for mnist.
safetensors = "0.4"
tokio = { version = "1.29", features = ["rt", "rt-multi-thread", "sync", "macros"] }
